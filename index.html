
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: clip;
            background: #f5f0e8;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            overflow-x: clip;
            background: #f5f0e8;
        }

        /*
          Fixed background layer.
          This is separate from the scrolling section.
        */
        .background-layer {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            z-index: 0;
            background: #f5f0e8;
            pointer-events: none;
        }

        .background {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        /*
          Creates the scroll distance for the animation.
        */
        .opening {
            position: relative;
            height: 200vh;
            height: 200svh;
            z-index: 1;
        }

        /*
          Envelope layer stays over the background.
        */
        .envelope-layer {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            z-index: 2;
            pointer-events: none;
        }

        .envelope {
            position: absolute;
            width: min(76vw, 480px);
            height: 90%;
            left: 50%;
            top: 50%;
            object-fit: contain;
            object-position: center;
            transform: translate3d(-50%, -50%, 0);
            opacity: 1;
            will-change: transform, opacity;
        }

        /* Mobile screens */
        @media (max-width: 600px) {
            .envelope {
                width: 92vw;
                height: 78%;
            }
        }

        /* Landscape phones */
        @media (max-height: 500px) {
            .envelope {
                height: 88%;
                width: auto;
                max-width: 75vw;
            }
        }
    </style>
</head>

<body>

    <!-- Background image: table and invitation card together -->
    <div class="background-layer">
        <img
            class="background"
            src="background.png"
            alt=""
        >
    </div>

    <!-- Scroll distance -->
    <main class="opening"></main>

    <!-- Only the envelope is animated -->
    <div class="envelope-layer">
        <img
            class="envelope"
            src="envelope.png"
            alt=""
        >
    </div>

    <script>
        const opening = document.querySelector(".opening");
        const envelope = document.querySelector(".envelope");

        let ticking = false;

        function updateAnimation() {
            const maxScroll = Math.max(
                1,
                opening.offsetHeight - window.innerHeight
            );

            const progress = Math.max(
                0,
                Math.min(1, window.scrollY / maxScroll)
            );

            /*
              Move the envelope upward and fade it out.
              The background is never changed by this animation.
            */
            const viewportHeight = window.innerHeight;
            const moveY = -progress * viewportHeight * 1.3;

            envelope.style.transform =
                `translate3d(-50%, calc(-50% + ${moveY}px), 0)`;

            envelope.style.opacity = String(1 - progress);

            ticking = false;
        }

        function requestUpdate() {
            if (!ticking) {
                ticking = true;
                window.requestAnimationFrame(updateAnimation);
            }
        }

        window.addEventListener(
            "scroll",
            requestUpdate,
            { passive: true }
        );

        window.addEventListener("resize", requestUpdate);
        window.addEventListener("orientationchange", requestUpdate);

        updateAnimation();
    </script>

</body>
</html>
