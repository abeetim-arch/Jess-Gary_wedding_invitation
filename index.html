<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Our Wedding</title>


    <style>

        /* =========================================
           GENERAL
        ========================================= */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;

            background: #535e41;

            color: #2c2926;

            font-family: Georgia, serif;
        }


        /* =========================================
           OPENING AREA
        ========================================= */

        .opening {
    height: 180vh;
    position: relative;
}


        /* =========================================
           STICKY ANIMATION AREA
        ========================================= */

        .photo-section {

            position: sticky;

            top: 0;

            height: 100vh;

            overflow: hidden;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        /* =========================================
           PHOTO
        ========================================= */

        .photo {

            position: absolute;

            width: 100vw;

            height: 100vh;

            background-image:
                url("wedding-photo.jpg");

            background-size: cover;

            background-position: center;

            z-index: 1;

            opacity: 1;

            will-change: opacity;
        }


        /* =========================================
           WEDDING DETAILS

           This is NOT part of the frame.

           It sits on top of the photograph and
           fades in near the end of the animation.
        ========================================= */

        .wedding-details {

            position: absolute;

            z-index: 2;

            left: 8%;

            right: 8%;

            top: 50%;

            transform: translateY(-50%);

            text-align: center;

            color: white;

            opacity: 0;

            text-shadow:
                0 2px 15px rgba(0,0,0,0.55);

            will-change: opacity;

            pointer-events: none;
        }


        .wedding-details h2 {

            margin: 0 0 30px;

            font-size:
                clamp(42px, 8vw, 75px);

            font-weight: normal;
        }


        .wedding-details p {

            max-width: 600px;

            margin: 20px auto;

            font-size: 19px;

            line-height: 1.8;
        }


        .wedding-details .date {

            font-weight: bold;

            font-size: 21px;

            margin-top: 30px;
        }


        /* =========================================
           YOUR CUSTOM FRAME
        ========================================= */

        .frame {

            position: absolute;

            width: 100vw;

            height: 100vh;

            background-image:
                url("wedding-frame.png");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            z-index: 3;

            pointer-events: none;

            will-change: transform;
        }


        /* =========================================
           JESS & GARY

           This belongs to the FRAME.

           Therefore it moves away together with
           the frame.

           Position this wherever the text should
           appear underneath your cutout.
        ========================================= */

    .frame-names {
    position: absolute;

    z-index: 4;

    left: 10%;
    right: 10%;

    top: 5%;

    text-align: center;

    color: white;

    text-shadow:
        0 2px 15px rgba(0,0,0,0.6);

    pointer-events: none;

    will-change: transform, opacity;
}


.frame-names h1 {
    margin: 0;

    font-size:
        clamp(45px, 9vw, 90px);

    font-weight: normal;

    font-family: Italianno Regular

}


.frame-names p {
    margin-top: 600px;

    font-size: 20px;

    letter-spacing: 5px;

    text-transform: uppercase;
}

        /* =========================================
           CONTENT AFTER OPENING
        ========================================= */

        .content {

            min-height: 120vh;

            padding:
                120px 25px;

            text-align: center;

            background: #f5f1eb;
        }


        .content h2 {

            margin: 0 0 30px;

            font-size:
                clamp(42px, 8vw, 75px);

            font-weight: normal;
        }


        .content p {

            max-width: 600px;

            margin: 20px auto;

            font-size: 19px;

            line-height: 1.8;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            .opening {
                height: 170vh;
            }


            .wedding-details {

                left: 7%;

                right: 7%;
            }


            .wedding-details h2 {

                font-size: 48px;

                margin-bottom: 20px;
            }


            .wedding-details p {

                font-size: 17px;

                line-height: 1.65;
            }


            .wedding-details .date {

                font-size: 19px;
            }


            .frame-names {

                left: 7%;

                right: 7%;

                bottom: 10%;
            }


            .frame-names h1 {

                font-size: 48px;
            }


            .frame-names p {

                font-size: 12px;

                letter-spacing: 3px;
            }
        }

    </style>

</head>


<body>


    <!-- =========================================
         OPENING
    ========================================= -->

    <section class="opening">


        <div class="photo-section">


            <!-- =================================
                 PHOTO
            ================================== -->

            <div class="photo"></div>


            <!-- =================================
                 WEDDING DETAILS

                 This stays on the photograph.

                 It fades in after the frame is
                 almost completely gone.
            ================================== -->

            <div class="wedding-details">

                <h2>
                    Our Wedding
                </h2>


                <p>
                    We would love for you to join us
                    as we celebrate our wedding day.
                </p>


                <p class="date">
                    2027 - 05 - 29
                </p>


                <p>
                    Toronto, Canada
                </p>


                <p>
                    Hotel link/info: 
                </p>


                <p>
                    More details coming soon.
                </p>

            </div>


            <!-- =================================
                 FRAME

                 This moves upward.
            ================================== -->

            <div class="frame"></div>


            <!-- =================================
                 NAMES ON THE FRAME

                 This moves upward together with
                 the frame.
            ================================== -->

            <div class="frame-names">

                <h1>
                    Save the date
                </h1>

                <p>
                    Jessica's & Gary's wedding
                </p>

            </div>


        </div>

    </section>


    <!-- =========================================
         CONTENT AFTER OPENING
    ========================================= -->

 
    <!-- =========================================
         ANIMATION
    ========================================= -->

    <script>

        const opening =
            document.querySelector(".opening");

        const frame =
            document.querySelector(".frame");

        const frameNames =
            document.querySelector(".frame-names");

        const photo =
            document.querySelector(".photo");

        const weddingDetails =
            document.querySelector(".wedding-details");


        window.addEventListener("scroll", () => {


            /* =====================================
               SCROLL PROGRESS
            ===================================== */

            const rect =
                opening.getBoundingClientRect();


            let progress =
                -rect.top /
                (opening.offsetHeight -
                 window.innerHeight);


            progress =
                Math.max(
                    0,
                    Math.min(1, progress)
                );


            /* =====================================
               MOVE FRAME

               The frame AND Jess & Gary move
               upward together.
            ===================================== */

            const frameY =
                progress * -120;


            frame.style.transform =
                `translateY(${frameY}vh)`;


            frameNames.style.transform =
                `translateY(${frameY}vh)`;

            const namesOpacity = 0.5 - progress;

            frameNames.style.opacity = namesOpacity;


            /* =====================================
               FINAL TRANSITION

               Start when roughly 10% of the
               frame is still visible.
            ===================================== */

            const fadeStart = 0.70;


            let fadeProgress =
                (progress - fadeStart) /
                (1 - fadeStart);


            fadeProgress =
                Math.max(
                    0,
                    Math.min(1, fadeProgress)
                );


            /* =====================================
               FADE PHOTO

               100% → 50%
            ===================================== */

            photo.style.opacity =
                1 - (fadeProgress * 0.7);


            /* =====================================
               FADE WEDDING DETAILS

               0% → 100%
            ===================================== */

            weddingDetails.style.opacity =
                fadeProgress;

        });

        if (progress >= 1) {
    weddingDetails.style.opacity = 1;
    photo.style.opacity = 0.5;
    frame.style.transform = `translateY(-120vh)`;
    frameNames.style.transform = `translateY(-120vh)`;
}

    </script>


</body>

</html>
