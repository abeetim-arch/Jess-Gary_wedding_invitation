
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
        }

        body {
            background: #f5f0e8;
            overflow-x: hidden;
        }

        /* Scrollable opening section */
        .opening {
            position: relative;
            height: 200vh;
        }

        /* Stays fixed in view while scrolling through opening */
        .scene {
            position: fixed;
            top: 0;
            width: 100%;
            height: 100vh;
            height: 100svh;
            overflow: hidden;
            isolation: isolate;
        }

        /* Single image: table + invitation card */
        .background {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 1;
        }

        /* Separate transparent envelope image */
        .envelope {
            position: absolute;
            z-index: 2;
            width: min(76vw, 480px);
            height: 90%;
            left: 50%;
            top: 50%;
            object-fit: contain;
            object-position: center;
            transform: translate(-50%, -50%);
            opacity: 1;
            will-change: transform, opacity;
            pointer-events: none;
        }

        /* Mobile layout */
        @media (max-width: 600px) {
            .envelope {
                width: 92vw;
                height: 78%;
            }
        }

        /* Landscape phones */
        @media (max-height: 500px) {
            .envelope {
                height: 88%;
                width: auto;
                max-width: 75vw;
            }
        }

        /* Respect reduced-motion preferences */
        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }
        }
    </style>
</head>

<body>

    <main class="opening">
        <section class="scene">

            <!-- This image includes BOTH the table and invitation card -->
            <img
                class="background"
                src="background.png"
                alt=""
            >

            <!-- Only the envelope moves and fades out -->
            <img
                class="envelope"
                src="envelope.png"
                alt=""
            >

        </section>
    </main>

    <script>
        const opening = document.querySelector(".opening");
        const envelope = document.querySelector(".envelope");

        let ticking = false;

        function updateAnimation() {
            const rect = opening.getBoundingClientRect();
            const scrollDistance =
                opening.offsetHeight - window.innerHeight;

            let progress = scrollDistance > 0
                ? -rect.top / scrollDistance
                : 0;

            progress = Math.max(0, Math.min(1, progress));

            // Move the envelope upward as the visitor scrolls
            const moveY = progress * -130;

            envelope.style.transform =
                `translate(-50%, calc(-50% + ${moveY}vh))`;

            // Fade out the envelope only
            envelope.style.opacity = 1 - progress;

            ticking = false;
        }

        function requestAnimationUpdate() {
            if (!ticking) {
                window.requestAnimationFrame(updateAnimation);
                ticking = true;
            }
        }

        window.addEventListener(
            "scroll",
            requestAnimationUpdate,
            { passive: true }
        );

        window.addEventListener("resize", requestAnimationUpdate);

        updateAnimation();
    </script>

</body>
</html>
