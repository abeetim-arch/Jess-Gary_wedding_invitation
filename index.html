
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        html {
            overflow-x: clip;
        }

        body {
            background: #f5f0e8;
            overflow-x: clip;
        }

        /*
          The section provides the scroll distance.
          The scene stays fixed while the envelope animates.
        */
        .opening {
            position: relative;
            height: 200vh;
            height: 200svh;
        }

        .scene {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100vh;
            height: 100svh;
            overflow: hidden;
            isolation: isolate;
            background: #f5f0e8;
        }

        /* One background image containing the table and card */
        .background {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 1;
        }

        /* The only element that moves and fades */
        .envelope {
            position: absolute;
            z-index: 2;
            width: min(76vw, 480px);
            height: 90%;
            left: 50%;
            top: 50%;
            object-fit: contain;
            object-position: center;
            transform: translate(-50%, -50%);
            opacity: 1;
            will-change: transform, opacity;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            .envelope {
                width: 92vw;
                height: 78%;
            }
        }

        @media (max-height: 500px) {
            .envelope {
                height: 88%;
                width: auto;
                max-width: 75vw;
            }
        }
    </style>
</head>

<body>

    <main class="opening">
        <section class="scene">

            <!-- Background includes the table AND invitation card -->
            <img
                class="background"
                src="background.png"
                alt=""
            >

            <!-- Separate transparent envelope -->
            <img
                class="envelope"
                src="envelope.png"
                alt=""
            >

        </section>
    </main>

    <script>
        const opening = document.querySelector(".opening");
        const envelope = document.querySelector(".envelope");

        let ticking = false;

        function updateAnimation() {
            const scrollDistance =
                opening.offsetHeight - window.innerHeight;

            const scrolled = Math.max(
                0,
                Math.min(scrollDistance, window.scrollY)
            );

            const progress = scrollDistance > 0
                ? scrolled / scrollDistance
                : 0;

            // Move upward by 130% of the current viewport height
            const moveY = -progress * window.innerHeight * 1.3;

            envelope.style.transform =
                `translate(-50%, calc(-50% + ${moveY}px))`;

            // Fade the envelope away; never fade the background
            envelope.style.opacity = 1 - progress;

            ticking = false;
        }

        function requestAnimationUpdate() {
            if (!ticking) {
                ticking = true;
                window.requestAnimationFrame(updateAnimation);
            }
        }

        window.addEventListener(
            "scroll",
            requestAnimationUpdate,
            { passive: true }
        );

        window.addEventListener(
            "resize",
            requestAnimationUpdate
        );

        window.addEventListener(
            "orientationchange",
            requestAnimationUpdate
        );

        updateAnimation();
    </script>

</body>
</html>
